<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎉 元旦快乐 - 幸运抽奖 🎉</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #fff;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            width: 90%;
            max-width: 400px;
            color: #333;
        }
        h1 { color: #d63031; margin-bottom: 0.5rem; }
        .subtitle { font-size: 0.9rem; color: #636e72; margin-bottom: 2rem; }
        
        #display-box {
            height: 100px;
            line-height: 100px;
            font-size: 1.5rem;
            font-weight: bold;
            border: 3px dashed #fab1a0;
            margin-bottom: 2rem;
            border-radius: 10px;
            background: #fff;
            color: #d63031;
            overflow: hidden;
            transition: all 0.3s;
        }

        .btn {
            background: #d63031;
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(214, 48, 49, 0.4);
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { background: #ccc; cursor: not-allowed; }

        .result-overlay {
            display: none;
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 10px;
            background: #f1f2f6;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <h1>🧧 元旦抽奖 🧧</h1>
    <p class="subtitle">抽取你的开年好运吧！</p>
    
    <div id="display-box">点击下方按钮开始</div>
    
    <button class="btn" id="draw-btn" onclick="startDraw()">开始抽奖</button>

    <div id="result-area" class="result-overlay">
        <p style="margin:0; font-weight:bold;">恭喜获得：</p>
        <p id="final-prize" style="color:#d63031; font-size:1.2rem; margin:10px 0;"></p>
        <p style="font-size:0.8rem; color:#666;">✨ 请截图发送给我报销 ✨</p>
    </div>
</div>

<script>
    const prizes = [
        { name: "一等奖：52r", weight: 5 },
        { name: "二等奖：自选官周报销", weight: 15 },
        { name: "三等奖：小蛋糕一个", weight: 20 },
        { name: "四等奖：5.2r", weight: 30 },
        { name: "五等奖：0.52r", weight: 30 }
    ];

    let isDrawing = false;

    function startDraw() {
        if (isDrawing) return;
        
        const btn = document.getElementById('draw-btn');
        const display = document.getElementById('display-box');
        const resultArea = document.getElementById('result-area');
        
        isDrawing = true;
        btn.disabled = true;
        resultArea.style.display = 'none';
        
        let counter = 0;
        const duration = 2000; // 滚动持续2秒
        const interval = setInterval(() => {
            const randomShow = prizes[Math.floor(Math.random() * prizes.length)].name;
            display.innerText = randomShow;
        }, 80);

        setTimeout(() => {
            clearInterval(interval);
            const finalPrize = getWeightedPrize();
            display.innerText = finalPrize.name;
            display.style.borderStyle = 'solid';
            display.style.backgroundColor = '#fff9f9';
            
            document.getElementById('final-prize').innerText = finalPrize.name;
            resultArea.style.display = 'block';
            
            isDrawing = false;
            btn.innerText = "重抽一次";
            btn.disabled = false;
        }, duration);
    }

    // 简易概率算法（你可以根据需要调整权重）
    function getWeightedPrize() {
        const totalWeight = prizes.reduce((sum, p) => sum + p.weight, 0);
        let random = Math.random() * totalWeight;
        for (const prize of prizes) {
            if (random < prize.weight) return prize;
            random -= prize.weight;
        }
        return prizes[prizes.length - 1];
    }
</script>

</body>
</html>
